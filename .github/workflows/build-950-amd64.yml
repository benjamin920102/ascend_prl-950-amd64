name: Build Ascend 950 amd64
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-950-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      RANK: '256'
      JOBS: '4'
      NPU_ARCH: dav-3510
      CANN_DOWNLOAD_DIR: ${{ github.workspace }}/.downloads
      CANN_TOOLKIT_SHA256: ${{ vars.CANN_TOOLKIT_SHA256 }}
      CANN_OPS_SHA256: ${{ vars.CANN_OPS_SHA256 }}
    steps:
      - uses: actions/checkout@v4
      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build git curl file zlib1g-dev libssl-dev pkg-config clang libclang-dev python3-dev python3-pip numactl
          python3 -m pip install --user numpy sympy scipy decorator psutil attrs cloudpickle pyyaml packaging protobuf
      - name: Cache CANN installers
        uses: actions/cache@v4
        with:
          path: .downloads
          key: cann-9.0.0-20260422000325096-950-linux-x86_64-v1
      - name: Download and install CANN 9.0.0 toolkit and 950 ops
        run: sudo --preserve-env=CANN_DOWNLOAD_DIR,CANN_TOOLKIT_SHA256,CANN_OPS_SHA256 bash scripts/install_cann.sh
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Fetch pinned Pearl dependencies
        run: bash scripts/fetch_deps.sh
      - name: Host BLAKE3 correctness tests
        run: make test-host
      - name: Compile 950 kernels and amd64 miner
        shell: bash
        run: |
          set -euo pipefail
          source scripts/env.sh
          make kernel
          make proof
          make miner
      - name: Package binaries
        shell: bash
        run: |
          set -euo pipefail
          file build/ascend_prl_* build/libpearl_*.so | tee build/ELF.txt
          grep -q 'x86-64' build/ELF.txt
          cp third_party/deps.env build/DEPENDENCIES.txt
          sha256sum .downloads/*.run >> build/DEPENDENCIES.txt
          cp proof-ffi/Cargo.lock build/Cargo.lock
          mkdir -p dist
          tar -czf dist/ascend_prl-950-linux-amd64.tar.gz build scripts README.md README_zh.md LICENSE
          sha256sum dist/*.tar.gz > dist/SHA256SUMS
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ascend_prl-950-linux-amd64
          path: dist/
          if-no-files-found: error
          retention-days: 14
